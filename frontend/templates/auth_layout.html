<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Career AI{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tools.css') }}">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: "DM Sans", "Segoe UI", sans-serif;
      background:
        radial-gradient(900px 500px at 15% 10%, rgba(20, 184, 166, 0.22), transparent 60%),
        linear-gradient(145deg, #0f172a 0%, #1e293b 55%, #134e4a 100%);
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 18px;
      padding: 36px 32px;
      box-shadow: 0 24px 64px rgba(2, 6, 23, 0.35);
    }
    .auth-brand {
      text-align: center;
      margin-bottom: 28px;
    }
    .auth-brand h1 {
      margin: 0;
      font-family: "Instrument Serif", Georgia, serif;
      font-weight: 400;
      font-size: 34px;
      letter-spacing: -0.5px;
      color: #0f172a;
    }
    .auth-brand p {
      margin: 8px 0 0;
      color: #64748b;
      font-size: 14px;
    }
    .auth-form label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }
    .auth-form input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      font-family: inherit;
      font-size: 14px;
      margin-bottom: 16px;
    }
    .auth-form input:focus {
      outline: none;
      border-color: #0d9488;
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.18);
    }
    .auth-form .btn-primary {
      background: #0d9488;
      border-color: #0d9488;
      font-family: inherit;
    }
    .auth-form .btn-primary:hover {
      background: #0f766e;
    }
    .auth-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #64748b;
    }
    .auth-footer a {
      color: #0d9488;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-brand">
        <h1>Career AI</h1>
        <p>{% block subtitle %}Sign in to continue{% endblock %}</p>
      </div>
      {% block content %}{% endblock %}
    </div>
  </div>
</body>
</html>
