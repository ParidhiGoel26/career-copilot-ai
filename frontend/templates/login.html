{% extends "auth_layout.html" %}

{% block title %}Login — Career AI{% endblock %}
{% block subtitle %}Sign in to your account{% endblock %}

{% block content %}
{% if error %}
<div class="alert alert-warning" style="margin-bottom:16px;">{{ error }}</div>
{% endif %}

<form class="auth-form" method="POST" action="{{ url_for('auth_login') }}">
  <input type="hidden" name="next" value="{{ next_url or '' }}">

  <label for="email">Email</label>
  <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">

  <label for="password">Password</label>
  <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">

  <button type="submit" class="btn btn-primary" style="width:100%;">Sign In</button>
</form>

<div class="auth-footer">
  Don't have an account? <a href="{{ url_for('register') }}">Create one</a>
</div>
{% endblock %}
